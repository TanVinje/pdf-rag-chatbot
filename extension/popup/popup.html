<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexzoneo Support</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="header-title">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Nexzoneo Support
      </h1>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Settings Panel (hidden by default) -->
    <div id="settings-panel" class="settings-panel hidden">
      <label class="settings-label" for="backend-url">Backend URL</label>
      <div class="settings-row">
        <input
          type="text"
          id="backend-url"
          class="settings-input"
          placeholder="http://localhost:8000"
        />
        <button id="save-settings-btn" class="btn btn-sm">Save</button>
      </div>
      <div id="settings-status" class="settings-status"></div>
    </div>

    <!-- Chat Messages -->
    <div id="chat-messages" class="chat-messages">
    </div>

    <!-- Suggested Questions -->
    <div id="suggestions" class="suggestions hidden">
      <button class="suggestion-btn" data-question="What products does Nexzoneo offer?">What products do you offer?</button>
      <button class="suggestion-btn" data-question="Tell me about your privacy policy">Privacy policy</button>
      <button class="suggestion-btn" data-question="How does Nexzoneo ensure GDPR compliance?">GDPR compliance</button>
      <button class="suggestion-btn" data-question="How do I get started with Nexzoneo?">How to get started</button>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-row">
        <input
          type="text"
          id="question-input"
          class="question-input"
          placeholder="...."
        />
        <button id="send-btn" class="icon-btn send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="powered-by">Powered by Nexzoneo</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
