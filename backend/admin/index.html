<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexzoneo Admin Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --brand: #3b82f6;
      --brand-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #334155;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---------- Header ---------- */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 span { color: var(--brand); }

    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .status-dot.connected { background: var(--success); }

    /* ---------- Auth Panel ---------- */
    .auth-panel {
      max-width: 500px;
      margin: 80px auto;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
    }

    .auth-panel h2 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .auth-panel p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .auth-row {
      display: flex;
      gap: 8px;
    }

    .auth-row input {
      flex: 1;
    }

    /* ---------- Main Layout ---------- */
    .main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 24px;
      display: none;
    }

    .main.visible { display: block; }

    /* ---------- Stats ---------- */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .stat-card .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--brand);
    }

    .stat-card .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    /* ---------- Cards ---------- */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h3 .badge {
      font-size: 11px;
      background: var(--brand);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    /* ---------- Form Elements ---------- */
    input, select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--brand); }

    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      color: #fff;
    }

    .btn-primary { background: var(--brand); }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---------- File Upload ---------- */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--brand);
      background: rgba(59, 130, 246, 0.05);
    }

    .upload-zone p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 8px;
    }

    .upload-zone .upload-icon {
      font-size: 32px;
      margin-bottom: 4px;
    }

    /* ---------- Logs Table ---------- */
    .logs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .logs-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .logs-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .logs-table tr:last-child td { border-bottom: none; }

    .logs-table .reason-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .reason-badge.low_similarity { background: #fef3c7; color: #92400e; }
    .reason-badge.no_documents { background: #fee2e2; color: #991b1b; }
    .reason-badge.llm_error { background: #fce7f3; color: #9d174d; }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      z-index: 999;
      animation: toast-in 0.3s ease;
    }

    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      .stats-row { grid-template-columns: 1fr; }
      .header { padding: 14px 16px; }
      .main { padding: 0 12px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><span>Nexzoneo</span> Admin Dashboard</h1>
    <div class="header-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
  </div>

  <!-- Auth Panel -->
  <div class="auth-panel" id="auth-panel">
    <h2>Admin Login</h2>
    <p>Enter your admin secret to access the dashboard.</p>
    <div class="auth-row">
      <input type="password" id="admin-secret" placeholder="Admin Secret" />
      <button class="btn btn-primary" id="login-btn">Login</button>
    </div>
    <p id="auth-error" style="color: var(--danger); margin-top: 12px; display: none;"></p>
  </div>

  <!-- Main Dashboard -->
  <div class="main" id="main-content">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="stat-docs">0</div>
        <div class="stat-label">Documents Indexed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-unanswered">0</div>
        <div class="stat-label">Unanswered Questions</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-top-reason">-</div>
        <div class="stat-label">Top Failure Reason</div>
      </div>
    </div>

    <!-- PDF Upload -->
    <div class="card">
      <h3>Upload PDFs <span class="badge">Knowledge Base</span></h3>
      <div class="upload-zone" id="upload-zone">
        <div class="upload-icon">+</div>
        <p>Drag &amp; drop PDF files here, or click to select</p>
        <input type="file" id="file-input" accept=".pdf" multiple hidden />
      </div>
      <div style="margin-top: 12px; display: flex; gap: 8px;">
        <button class="btn btn-danger" id="clear-kb-btn">Clear Knowledge Base</button>
      </div>
    </div>

    <!-- Unanswered Questions Log -->
    <div class="card">
      <h3>Unanswered Questions <span class="badge" id="log-count">0</span></h3>
      <div id="logs-container">
        <div class="empty-state">No unanswered questions yet.</div>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let adminToken = "";

    // DOM refs
    const authPanel = document.getElementById("auth-panel");
    const mainContent = document.getElementById("main-content");
    const loginBtn = document.getElementById("login-btn");
    const adminSecretInput = document.getElementById("admin-secret");
    const authError = document.getElementById("auth-error");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");

    // --- Auth ---
    loginBtn.addEventListener("click", login);
    adminSecretInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    async function login() {
      const secret = adminSecretInput.value.trim();
      if (!secret) return;

      adminToken = secret;

      try {
        const resp = await fetch(`${API}/stats`, {
          headers: { Authorization: `Bearer ${adminToken}` },
        });

        if (resp.ok) {
          authPanel.style.display = "none";
          mainContent.classList.add("visible");
          statusDot.classList.add("connected");
          statusText.textContent = "Connected";
          loadDashboard();
        } else {
          showAuthError("Invalid admin secret.");
        }
      } catch {
        showAuthError("Cannot connect to backend.");
      }
    }

    function showAuthError(msg) {
      authError.textContent = msg;
      authError.style.display = "block";
      setTimeout(() => { authError.style.display = "none"; }, 3000);
    }

    // --- Dashboard Data ---
    async function loadDashboard() {
      await Promise.all([loadStats(), loadLogs()]);
    }

    async function loadStats() {
      try {
        const resp = await fetch(`${API}/stats`, {
          headers: { Authorization: `Bearer ${adminToken}` },
        });
        const data = await resp.json();
        document.getElementById("stat-docs").textContent = data.document_count;
        document.getElementById("stat-unanswered").textContent = data.total_unanswered;

        const reasons = data.unanswered_by_reason || {};
        const topReason = Object.entries(reasons).sort((a, b) => b[1] - a[1])[0];
        document.getElementById("stat-top-reason").textContent = topReason
          ? topReason[0].replace("_", " ")
          : "-";
      } catch {
        toast("Failed to load stats", "error");
      }
    }

    async function loadLogs() {
      try {
        const resp = await fetch(`${API}/logs?limit=100`, {
          headers: { Authorization: `Bearer ${adminToken}` },
        });
        const data = await resp.json();
        const container = document.getElementById("logs-container");
        document.getElementById("log-count").textContent = data.total;

        if (!data.logs || data.logs.length === 0) {
          container.innerHTML = '<div class="empty-state">No unanswered questions yet.</div>';
          return;
        }

        let html = `<table class="logs-table">
          <thead><tr><th>Time</th><th>Question</th><th>Reason</th><th>Score</th></tr></thead>
          <tbody>`;

        for (const log of data.logs) {
          const time = new Date(log.timestamp).toLocaleString();
          const reason = log.reason.startsWith("llm_error") ? "llm_error" : log.reason;
          const score = log.similarity_score != null ? log.similarity_score.toFixed(3) : "-";
          html += `<tr>
            <td style="white-space: nowrap; font-size: 12px; color: var(--text-muted);">${time}</td>
            <td>${escapeHtml(log.question)}</td>
            <td><span class="reason-badge ${reason}">${reason}</span></td>
            <td>${score}</td>
          </tr>`;
        }

        html += "</tbody></table>";
        container.innerHTML = html;
      } catch {
        toast("Failed to load logs", "error");
      }
    }

    // --- PDF Upload ---
    const uploadZone = document.getElementById("upload-zone");
    const fileInput = document.getElementById("file-input");

    uploadZone.addEventListener("click", () => fileInput.click());

    uploadZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadZone.classList.add("dragover");
    });

    uploadZone.addEventListener("dragleave", () => {
      uploadZone.classList.remove("dragover");
    });

    uploadZone.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadZone.classList.remove("dragover");
      if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) uploadFiles(fileInput.files);
    });

    async function uploadFiles(files) {
      const formData = new FormData();
      let pdfCount = 0;
      for (const file of files) {
        if (file.name.toLowerCase().endsWith(".pdf")) {
          formData.append("files", file);
          pdfCount++;
        }
      }

      if (pdfCount === 0) {
        toast("Please select PDF files only.", "error");
        return;
      }

      uploadZone.innerHTML = '<p>Uploading...</p>';

      try {
        const resp = await fetch(`${API}/ingest`, {
          method: "POST",
          headers: { Authorization: `Bearer ${adminToken}` },
          body: formData,
        });

        if (resp.ok) {
          const data = await resp.json();
          toast(`Uploaded ${data.files_processed} file(s), ${data.total_chunks} chunks indexed.`, "success");
          loadDashboard();
        } else {
          const err = await resp.json().catch(() => ({}));
          toast(err.detail || "Upload failed.", "error");
        }
      } catch {
        toast("Upload failed. Is the backend running?", "error");
      }

      uploadZone.innerHTML = '<div class="upload-icon">+</div><p>Drag & drop PDF files here, or click to select</p>';
      fileInput.value = "";
    }

    // --- Clear KB ---
    document.getElementById("clear-kb-btn").addEventListener("click", async () => {
      if (!confirm("Are you sure? This will delete ALL documents from the knowledge base.")) return;

      try {
        const resp = await fetch(`${API}/clear`, {
          method: "POST",
          headers: { Authorization: `Bearer ${adminToken}` },
        });

        if (resp.ok) {
          toast("Knowledge base cleared.", "success");
          loadDashboard();
        } else {
          toast("Failed to clear knowledge base.", "error");
        }
      } catch {
        toast("Failed to clear knowledge base.", "error");
      }
    });

    // --- Helpers ---
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function toast(msg, type = "success") {
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }
  </script>

</body>
</html>
